
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Honeymoon Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary:#c8956c; --secondary:#e8b89a; --dark:#2c1810;
            --light:#fdf6f0; --green:#5a8a6a; --gold:#d4a853;
            --aus:#c75b3a; --sg:#c8394b; --text:#3a2a1a;
            --teal:#00897b; --purple:#7b1fa2; --blue:#1a6fa0;
        }
        body { font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#fdf6f0,#f5e6d8); color:var(--text); }

        /* HEADER */
        .header { background:linear-gradient(135deg,#2c1810,#5c3420,#8b4513); color:white; padding:30px 20px; text-align:center; }
        .header h1 { font-size:2.4em; margin-bottom:8px; text-shadow:2px 2px 10px rgba(0,0,0,0.3); }
        .header p { font-size:1.05em; opacity:0.85; }
        .hearts { animation:pulse 2s infinite; display:inline-block; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
        .trip-stats { display:flex; justify-content:center; gap:20px; margin-top:18px; flex-wrap:wrap; }
        .trip-stat { background:rgba(255,255,255,0.15); padding:10px 22px; border-radius:30px; font-size:0.9em; text-align:center; }
        .trip-stat strong { display:block; font-size:1.3em; }

        /* NAV */
        .nav { background:white; padding:8px 15px; display:flex; justify-content:center; flex-wrap:wrap; gap:5px; position:sticky; top:0; z-index:100; box-shadow:0 2px 15px rgba(0,0,0,0.1); }
        .nav-btn { padding:8px 14px; border:none; border-radius:20px; cursor:pointer; font-size:0.8em; font-weight:600; background:var(--light); color:var(--text); transition:all 0.25s; }
        .nav-btn:hover, .nav-btn.active { background:var(--primary); color:white; transform:translateY(-2px); box-shadow:0 4px 12px rgba(200,149,108,0.4); }

        /* LAYOUT */
        .container { max-width:1200px; margin:0 auto; padding:25px 18px; }
        .section { display:none; }
        .section.active { display:block; animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

        /* SUB-TABS */
        .sub-tabs { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
        .sub-tab { padding:7px 16px; border:2px solid var(--secondary); border-radius:20px; cursor:pointer; font-size:0.82em; font-weight:600; background:white; color:var(--text); transition:all 0.25s; }
        .sub-tab:hover, .sub-tab.active { background:var(--primary); border-color:var(--primary); color:white; }
        .tab-pane { display:none; }
        .tab-pane.active { display:block; animation:fadeIn 0.3s ease; }

        /* SECTION HEADER */
        .sec-head { text-align:center; margin-bottom:30px; }
        .sec-head h2 { font-size:1.9em; color:var(--dark); margin-bottom:8px; }
        .sec-head p { color:#888; }
        .divider { width:55px; height:4px; background:linear-gradient(to right,var(--primary),var(--gold)); margin:10px auto; border-radius:2px; }
        .cat-head { font-size:1.2em; font-weight:800; color:var(--dark); margin:25px 0 14px; padding-bottom:7px; border-bottom:3px solid var(--secondary); display:flex; align-items:center; gap:8px; }

        /* NOTES */
        .note { padding:13px 18px; border-radius:0 10px 10px 0; margin:12px 0; font-size:0.88em; line-height:1.5; }
        .note-warn    { background:linear-gradient(135deg,#fff3cd,#ffeaa7); border-left:4px solid var(--gold); }
        .note-success { background:linear-gradient(135deg,#d4edda,#c3e6cb); border-left:4px solid #28a745; }
        .note-danger  { background:linear-gradient(135deg,#fde8e8,#fad7d7); border-left:4px solid #e74c3c; }
        .note-info    { background:linear-gradient(135deg,#cce5ff,#b8daff); border-left:4px solid #2980b9; }

        /* TAGS */
        .tag { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.71em; font-weight:700; margin:4px 3px 0 0; }
        .t-flight    { background:#e8f4fd; color:#2980b9; }
        .t-hotel     { background:#fef9e7; color:var(--gold); }
        .t-activity  { background:#eafaf1; color:#27ae60; }
        .t-sg        { background:#fce4e6; color:var(--sg); }
        .t-aus       { background:#fde9e4; color:var(--aus); }
        .t-camper    { background:#e8f6f3; color:var(--teal); }
        .t-ok        { background:#d4edda; color:#155724; }
        .t-opera     { background:#f3e5f5; color:var(--purple); }

        /* BOOKING STATUS */
        .book-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:10px; margin-bottom:25px; }
        .book-item { background:white; border-radius:12px; padding:14px; text-align:center; box-shadow:0 3px 12px rgba(0,0,0,0.07); border-top:4px solid #ccc; }
        .book-item.ok  { border-top-color:#28a745; }
        .book-item.meh { border-top-color:#ffc107; }
        .book-item.no  { border-top-color:#dc3545; }
        .book-icon { font-size:1.7em; margin-bottom:5px; }
        .book-name { font-weight:700; font-size:0.82em; color:var(--dark); margin-bottom:5px; }
        .book-status { font-size:0.7em; font-weight:700; padding:2px 8px; border-radius:20px; }
        .bs-ok  { background:#d4edda; color:#155724; }
        .bs-meh { background:#fff3cd; color:#856404; }
        .bs-no  { background:#fde8e8; color:#c0392b; }

        /* PROGRESS */
        .prog-box { background:white; border-radius:14px; padding:22px; margin-bottom:25px; box-shadow:0 4px 18px rgba(0,0,0,0.07); }
        .prog-box h3 { margin-bottom:16px; color:var(--dark); }
        .prog-item { margin-bottom:12px; }
        .prog-label { display:flex; justify-content:space-between; font-size:0.85em; margin-bottom:4px; }
        .prog-bar { height:9px; background:var(--light); border-radius:9px; overflow:hidden; }
        .prog-fill { height:100%; border-radius:9px; background:linear-gradient(to right,var(--primary),var(--gold)); transition:width 1.5s ease; }

        /* WEATHER */
        .wx-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-bottom:25px; }
        .wx-card { background:white; border-radius:13px; padding:18px; text-align:center; box-shadow:0 3px 12px rgba(0,0,0,0.07); }
        .wx-icon { font-size:2.6em; margin-bottom:7px; }
        .wx-city { font-weight:700; font-size:1em; color:var(--dark); }
        .wx-month { font-size:0.76em; color:#888; margin-bottom:7px; }
        .wx-temp { font-size:1.6em; font-weight:800; color:var(--primary); }
        .wx-desc { font-size:0.78em; color:#888; margin-top:5px; }

        /* TIMELINE */
        .timeline { position:relative; padding:8px 0; }
        .timeline::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:3px; background:linear-gradient(to bottom,var(--sg),#7fb3d3,var(--aus)); transform:translateX(-50%); }
        .tl-row { display:flex; justify-content:flex-end; padding-right:calc(50% + 32px); margin-bottom:22px; position:relative; }
        .tl-row:nth-child(even) { justify-content:flex-start; padding-right:0; padding-left:calc(50% + 32px); }
        .tl-dot { position:absolute; left:50%; top:16px; width:16px; height:16px; border-radius:50%; transform:translateX(-50%); border:3px solid white; z-index:1; }
        .tl-card { background:white; border-radius:13px; padding:16px; max-width:420px; width:100%; box-shadow:0 4px 16px rgba(0,0,0,0.09); transition:transform 0.2s; cursor:pointer; }
        .tl-card:hover { transform:scale(1.02); }
        .tl-date { font-size:0.72em; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:4px; }
        .tl-card h3 { font-size:1.05em; margin-bottom:5px; }
        .tl-card p { font-size:0.82em; opacity:0.7; line-height:1.4; }

        /* CONFIRMED BANNERS */
        .banner { color:white; border-radius:14px; padding:18px 22px; margin-bottom:20px; display:flex; align-items:center; gap:14px; box-shadow:0 4px 18px rgba(0,0,0,0.15); }
        .banner.green  { background:linear-gradient(135deg,#155724,#1e7e34); }
        .banner.blue   { background:linear-gradient(135deg,#1a6fa0,#003d5b); }
        .banner.orange { background:linear-gradient(135deg,#c75b3a,#8b2a1a); }
        .banner.purple { background:linear-gradient(135deg,#4a148c,#7b1fa2); }
        .banner.teal   { background:linear-gradient(135deg,#00695c,#00897b); }
        .banner.maui   { background:linear-gradient(135deg,#e67e22,#ca6f1e); }
        .ban-icon { font-size:2.3em; flex-shrink:0; }
        .ban-body h3 { font-size:1.05em; font-weight:800; margin-bottom:3px; }
        .ban-body p  { font-size:0.82em; opacity:0.85; line-height:1.4; }
        .ban-badge { display:inline-block; background:rgba(255,255,255,0.22); padding:2px 11px; border-radius:20px; font-size:0.73em; font-weight:700; margin-top:6px; }

        /* MAUI CARD */
        .maui-card { background:linear-gradient(135deg,#e67e22,#ca6f1e); border-radius:16px; padding:25px; color:white; margin-bottom:22px; }
        .maui-card h2 { font-size:1.6em; font-weight:900; margin-bottom:5px; }
        .maui-card .sub { font-size:0.88em; opacity:0.85; margin-bottom:18px; }
        .maui-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
        .maui-item { background:rgba(255,255,255,0.15); padding:13px; border-radius:11px; text-align:center; }
        .maui-item .mi { font-size:1.7em; margin-bottom:5px; }
        .maui-item h4 { font-size:0.72em; opacity:0.78; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
        .maui-item p  { font-size:0.92em; font-weight:700; }
        .maui-tip { background:rgba(255,255,255,0.15); border-radius:11px; padding:13px; margin-top:14px; font-size:0.84em; line-height:1.6; }

        /* FLIGHT CARDS */
        .flight-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
        .f-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 5px 22px rgba(0,0,0,0.09); transition:transform 0.25s; }
        .f-card:hover { transform:translateY(-4px); }
        .f-head { padding:18px; color:white; }
        .f-head.klm     { background:linear-gradient(135deg,#00a1de,#003f8a); }
        .f-head.sia     { background:linear-gradient(135deg,#003B6F,#001f45); }
        .f-head.vna     { background:linear-gradient(135deg,#d4000a,#8b0000); }
        .f-head.dom     { background:linear-gradient(135deg,#e67e22,#d35400); }
        .f-route { display:flex; align-items:center; gap:10px; margin:10px 0; }
        .f-city .code { font-size:1.8em; font-weight:800; }
        .f-city .city { font-size:0.76em; opacity:0.8; }
        .f-line { flex:1; display:flex; flex-direction:column; align-items:center; }
        .f-line .dur { font-size:0.75em; opacity:0.8; margin-bottom:3px; }
        .f-line .ln  { width:100%; height:2px; background:rgba(255,255,255,0.4); }
        .f-body { padding:16px; }
        .f-details { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .fd { background:var(--light); padding:9px 11px; border-radius:9px; }
        .fd .lbl { font-size:0.7em; color:#888; text-transform:uppercase; }
        .fd .val { font-size:0.9em; font-weight:700; color:var(--dark); margin-top:2px; }
        .tip { background:#fff8f0; border-left:3px solid var(--primary); padding:7px 11px; border-radius:0 7px 7px 0; font-size:0.78em; color:#a0522d; margin-top:10px; }
        .tip.purple { background:#f3e5f5; border-left-color:var(--purple); color:#4a148c; }

        /* DAY CARDS */
        .day-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 5px 22px rgba(0,0,0,0.08); margin-bottom:20px; }
        .day-head { padding:18px; color:white; }
        .day-head.sg     { background:linear-gradient(135deg,var(--sg),#8b1a2a); }
        .day-head.syd    { background:linear-gradient(135deg,var(--aus),#8b2a1a); }
        .day-head.au     { background:linear-gradient(135deg,var(--blue),#003d5b); }
        .day-head.opera  { background:linear-gradient(135deg,#4a148c,#7b1fa2); }
        .day-head.cairns { background:linear-gradient(135deg,var(--teal),#00695c); }
        .day-num   { font-size:0.8em; opacity:0.8; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
        .day-title { font-size:1.3em; font-weight:800; margin:4px 0; }
        .day-date  { font-size:0.8em; opacity:0.75; }
        .day-body  { padding:18px; }
        .act { display:flex; gap:13px; margin-bottom:14px; }
        .act-time { font-size:0.76em; font-weight:700; color:var(--primary); min-width:50px; text-align:right; padding-top:2px; flex-shrink:0; }
        .act-line { flex:1; border-left:2px solid var(--secondary); padding-left:13px; padding-bottom:10px; }
        .act-line.op { border-left-color:var(--purple); }
        .act-title { font-weight:700; font-size:0.9em; margin-bottom:3px; }
        .act-title.op { color:var(--purple); }
        .act-desc  { font-size:0.79em; color:#888; line-height:1.5; }

        /* HIGHLIGHT GRID */
        .hl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:22px; }
        .hl-card { background:white; border-radius:13px; padding:17px; box-shadow:0 3px 15px rgba(0,0,0,0.07); border-top:4px solid var(--primary); transition:transform 0.2s; }
        .hl-card:hover { transform:translateY(-4px); }
        .hl-card.op { border-top-color:var(--purple); background:linear-gradient(135deg,#fff,#faf5ff); }
        .hl-icon { font-size:2.2em; margin-bottom:9px; }
        .hl-card h4 { font-size:0.96em; margin-bottom:5px; color:var(--dark); }
        .hl-card p  { font-size:0.8em; color:#888; line-height:1.5; }
        .hl-tag { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.7em; font-weight:700; margin-top:7px; background:var(--light); color:var(--primary); }
        .hl-tag.op { background:#f3e5f5; color:var(--purple); }

        /* ROUTE MAP */
        .route-box { background:white; border-radius:16px; padding:25px; box-shadow:0 5px 22px rgba(0,0,0,0.08); margin-bottom:22px; }
        .route-stops { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin:22px 0; }
        .r-stop { text-align:center; flex:1; min-width:85px; }
        .r-dot { width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--gold)); color:white; font-size:1.3em; display:flex; align-items:center; justify-content:center; margin:0 auto 7px; box-shadow:0 4px 10px rgba(200,149,108,0.35); }
        .r-dot.ok { background:linear-gradient(135deg,#155724,#28a745); }
        .r-name { font-weight:700; font-size:0.82em; }
        .r-date { font-size:0.7em; color:#888; margin-top:2px; }
        .r-status { font-size:0.7em; font-weight:700; color:var(--primary); }
        .r-status.ok { color:#155724; }
        .r-conn { flex:0.4; height:3px; background:linear-gradient(to right,var(--primary),var(--gold)); position:relative; min-width:20px; }
        .r-conn::after { content:'🚐'; position:absolute; top:50%; left:50%; transform:translate(-50%,-60%); font-size:1em; }

        /* REEF CARD */
        .reef-card { background:linear-gradient(135deg,#003d5b,#00728a); border-radius:16px; padding:25px; color:white; margin-bottom:22px; }
        .reef-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:16px; }
        .reef-item { background:rgba(255,255,255,0.1); padding:13px; border-radius:11px; text-align:center; }
        .reef-item .ri { font-size:1.7em; margin-bottom:5px; }
        .reef-item h4 { font-size:0.85em; margin-bottom:3px; }
        .reef-item p  { font-size:0.77em; opacity:0.82; }

        /* HOTEL CARDS */
        .hotel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
        .h-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 5px 22px rgba(0,0,0,0.09); transition:transform 0.25s; }
        .h-card:hover { transform:translateY(-4px); }
        .h-img { height:85px; display:flex; align-items:center; justify-content:center; font-size:3em; position:relative; }
        .h-img.sg-bg     { background:linear-gradient(135deg,#c8394b15,#c8394b0a); }
        .h-img.cairns-bg { background:linear-gradient(135deg,#00897b15,#00897b0a); }
        .h-img.maui-bg   { background:linear-gradient(135deg,#e67e2215,#e67e220a); }
        .h-img.syd-bg    { background:linear-gradient(135deg,#c75b3a15,#c75b3a0a); }
        .h-ribbon { position:absolute; top:8px; right:8px; background:#155724; color:white; padding:2px 9px; border-radius:20px; font-size:0.68em; font-weight:700; }
        .h-info { padding:16px; }
        .h-info h3 { font-size:1em; margin-bottom:3px; }
        .h-loc { font-size:0.8em; color:#888; margin-bottom:5px; }
        .h-stars { color:#f39c12; font-size:0.88em; }
        .h-desc { font-size:0.8em; color:#888; margin-top:7px; line-height:1.5; }
        .h-status { font-size:0.8em; font-weight:700; margin-top:7px; }
        .h-feats { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
        .feat { background:var(--light); padding:2px 9px; border-radius:20px; font-size:0.73em; }

        /* OPERA TICKET */
        .ticket { background:linear-gradient(135deg,#1a0533,#4a148c); color:white; border-radius:16px; overflow:hidden; box-shadow:0 10px 35px rgba(74,20,140,0.4); margin-bottom:22px; }
        .ticket-head { padding:25px 25px 18px; border-bottom:2px dashed rgba(255,255,255,0.2); }
        .ticket-venue { font-size:0.75em; opacity:0.7; text-transform:uppercase; letter-spacing:2px; margin-bottom:5px; }
        .ticket-title { font-size:1.65em; font-weight:900; margin-bottom:4px; }
        .ticket-sub   { font-size:0.85em; opacity:0.8; }
        .ticket-body  { padding:20px 25px; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
        .td { text-align:center; }
        .td-lbl { font-size:0.67em; opacity:0.6; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
        .td-val { font-size:1em; font-weight:800; }
        .ticket-foot { padding:12px 25px; background:rgba(0,0,0,0.2); font-size:0.8em; opacity:0.85; }

        /* SYDNEY HOTELS */
        .sh-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
        .sh-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 5px 22px rgba(0,0,0,0.09); transition:transform 0.25s; border:2px solid transparent; }
        .sh-card:hover { transform:translateY(-4px); }
        .sh-card.rec { border-color:var(--gold); }
        .sh-banner { height:70px; display:flex; align-items:center; justify-content:center; font-size:2.6em; position:relative; }
        .sh-banner.lux  { background:linear-gradient(135deg,#2c1810,#5c3420); }
        .sh-banner.prem { background:linear-gradient(135deg,#003B6F,#00528a); }
        .sh-banner.bout { background:linear-gradient(135deg,#5a2d82,#7b3fa0); }
        .sh-banner.mid  { background:linear-gradient(135deg,#1a6fa0,#2980b9); }
        .sh-ribbon { position:absolute; top:8px; right:8px; background:var(--gold); color:white; padding:2px 9px; border-radius:20px; font-size:0.67em; font-weight:700; }
        .sh-body { padding:16px; }
        .sh-name  { font-size:1.05em; font-weight:800; color:var(--dark); margin-bottom:3px; }
        .sh-area  { font-size:0.78em; color:#888; margin-bottom:8px; }
        .sh-price { font-size:1.2em; font-weight:800; color:var(--primary); }
        .sh-price span { font-size:0.56em; font-weight:400; color:#888; }
        .sh-total { font-size:0.76em; color:#888; margin-bottom:9px; }
        .sh-pros li { font-size:0.79em; color:#555; margin-bottom:3px; list-style:none; }
        .sh-pros li::before { content:'✓ '; color:var(--green); font-weight:700; }
